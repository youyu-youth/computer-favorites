spring:
  application:
    name: computer-favorites
  profiles:
    active: local
  ai:
    dash scope:
      api-key: ${model.api-key.dashboard:sk-placeholder}
    deepseek:
      api-key: ${model.api-key.deepseek}
    mcp:
      client:
        enabled: true
        # 异步模式
        type: SYNC
        request-timeout: 30s
        streamable-http:
          connections:
            tavily:
              url: https://mcp.tavily.com
              endpoint: /mcp/?tavilyApiKey=${tavily.api-key}
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
            schema: classpath:/sql/schema-mysql.sql
  mail:
    host: ${CF_MAIL_HOST:127.0.0.1}
    port: ${CF_MAIL_PORT:25}
    username: ${CF_MAIL_USERNAME:}
    password: ${CF_MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${CF_MAIL_AUTH:false}
          starttls:
            enable: ${CF_MAIL_STARTTLS:false}

server:
  port: 8080

logging:
  level:
    com.yyyouth: INFO

audit:
  log:
    enabled: ${CF_AUDIT_LOG_ENABLED:true}

cf:
  auth:
    enable: true
    whitelist:
      - /api/auth/login
      - /api/admin/auth/login
      - /api/auth/register
      - /api/auth/register/code
      - /api/auth/register/username/check
      - /api/website/**
      - /api/user/profile/public/**
  profile:
    marker: base

minio:
  # MinIO 服务地址
  endpointUrl: ${CF_MINIO_ENDPOINT:http://127.0.0.1:9000}
  # MinIO 访问账号
  accessKey: ${CF_MINIO_ACCESS_KEY:admin}
  # MinIO 访问密钥（按项目现有命名使用 secreKey）
  secreKey: ${CF_MINIO_SECRE_KEY:admin123}
  # MinIO 默认桶名称
  bucketName: ${CF_MINIO_BUCKET:computer-favorites}
