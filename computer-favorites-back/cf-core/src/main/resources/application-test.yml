spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${CF_DB_URL:jdbc:mysql://127.0.0.1:3306/computer_favorites_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${CF_DB_USERNAME:root}
    password: ${CF_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${CF_REDIS_HOST:127.0.0.1}
      port: ${CF_REDIS_PORT:6379}
      database: ${CF_REDIS_DB:6}
      timeout: 3000ms

server:
  port: 19080

logging:
  level:
    com.yyyouth: WARN

cf:
  auth:
    enable: true
    whitelist:
      - /api/auth/login
      - /api/admin/auth/login
      - /api/auth/register
      - /api/website/**
  profile:
    marker: test

minio:
  # MinIO 服务地址
  endpointUrl: http://127.0.0.1:9000
  # MinIO 访问账号
  accessKey: admin
  # MinIO 访问密钥（按项目现有命名使用 secreKey）
  secreKey: admin123
  # MinIO 默认桶名称
  bucketName: computer-favorites
